<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnuvaya Katıl | FIFA Ligi</title>
    <link rel="stylesheet" href="/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; background-color: #121212;
        }

        .invite-container {
            width: 100%; max-width: 420px; padding: 40px 30px;
            background: rgba(30, 30, 30, 0.8); border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); text-align: center; display: none;
            box-sizing: border-box;
        }

        .invite-icon {
            font-size: 3.5em; margin-bottom: 10px; animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .invite-title {
            color: #fff; font-size: 1.6em; margin-bottom: 5px; font-weight: 900;
        }

        .invite-creator {
            color: #aaa; font-size: 0.9em; margin-bottom: 25px; font-style: italic;
        }

        .tournament-name-box {
            background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px;
            border: 1px dashed rgba(255,255,255,0.2); margin-bottom: 20px;
            color: #00ff88; font-size: 1.3em; font-weight: bold; word-break: break-word;
        }

        .capacity-wrap {
            margin-bottom: 25px;
        }
        .capacity-label {
            display: flex; justify-content: space-between; font-size: 0.85em;
            color: #ccc; margin-bottom: 8px; font-weight: bold;
        }
        .capacity-bar-bg {
            width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden;
        }
        .capacity-bar-fill {
            height: 100%; background: linear-gradient(90deg, #00ff88, #00cc6a);
            width: 0%; transition: width 0.5s ease;
        }

        .btn-join {
            width: 100%; padding: 15px; background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: #000; font-size: 1.1em; font-weight: 900; border: none; border-radius: 12px;
            cursor: pointer; transition: all 0.3s; margin-bottom: 12px;
        }
        .btn-join:hover { box-shadow: 0 4px 20px rgba(0,255,136,0.4); transform: translateY(-2px); }
        .btn-join:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }

        .btn-cancel {
            width: 100%; padding: 15px; background: transparent; border: 1px solid #555;
            color: #aaa; font-size: 1em; font-weight: bold; border-radius: 12px;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-cancel:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: #888; }

        #loadingScreen {
            text-align: center; color: #00ff88; font-size: 1.2em; font-weight: bold;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="loadingScreen">⏳ Davetiye Kontrol Ediliyor...</div>

    <div class="invite-container" id="inviteCard">
        <div class="invite-icon">🎟️</div>
        <div class="invite-title">Turnuva Daveti</div>
        <div class="invite-creator" id="creatorText">✍️ Kurucu: Yükleniyor...</div>

        <div class="tournament-name-box" id="tNameText">Turnuva Adı</div>

        <div class="capacity-wrap">
            <div class="capacity-label">
                <span>Kapasite</span>
                <span id="capacityText">0/0</span>
            </div>
            <div class="capacity-bar-bg">
                <div class="capacity-bar-fill" id="capacityBar"></div>
            </div>
        </div>

        <button class="btn-join" id="joinBtn" onclick="joinTournament()">Katıl</button>
        <button class="btn-cancel" onclick="window.location.href='/index.html'">İptal Et ve Lobiye Dön</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ KENDİ GÜNCEL FİREBASE BİLGİLERİNİ YAPIŞTIR
        const firebaseConfig = {
            apiKey: "AIzaSyAXfQzf_zNClZHzSClAVIFY4Jozlx44yV0",
            authDomain: "football-tournament-web-app.firebaseapp.com",
            databaseURL: "https://football-tournament-web-app-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "football-tournament-web-app",
            storageBucket: "football-tournament-web-app.firebasestorage.app",
            messagingSenderId: "381451877946",
            appId: "1:381451877946:web:d3cc57357ae68c5bc63f03"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const params = new URLSearchParams(window.location.search);
        const inviteCode = params.get('kod');

        let currentUserUid = null;
        let myPlayerName = null;
        let tournamentData = null;

        const Toast = Swal.mixin({ toast: true, position: 'bottom-end', showConfirmButton: false, timer: 3000, background: '#1e1e2e', color: '#fff' });

        // 🔥 Zaman Aşımı Zırhı
        const fetchWithTimeout = (promise, ms = 6000) => {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT')), ms))
            ]);
        };

        // 1. GİRİŞ KONTROLÜ VE KARŞILAMA KAPISI
        onAuthStateChanged(auth, async (user) => {
            // 🔥 GÜNCELLENDİ: Firebase kurallarını ihlal eden bir kod yazıldıysa direkt reddet
            if (!inviteCode || /[.#$\[\]]/.test(inviteCode)) {
                return showError("Geçersiz Davet Linki", "Bu linkteki turnuva kodu hatalı veya bozuk.");
            }

            if (!user) {
                // Giriş yapmamışsa URL hafızasıyla login'e yolla
                const currentUrl = encodeURIComponent(window.location.href);
                window.location.href = `/login.html?returnTo=${currentUrl}`;
                return;
            }

            currentUserUid = user.uid;

            try {
                // Oyuncu ismini çek
                const userRef = ref(db, `oyuncu_havuzu/${currentUserUid}`);
                const userSnap = await fetchWithTimeout(get(userRef));

                if (!userSnap.exists() || !userSnap.val().name) {
                    // İsmi yoksa Profile zorunlu yönlendir (URL hafızasıyla)
                    const currentUrl = encodeURIComponent(window.location.href);
                    window.location.href = `/profil.html?returnTo=${currentUrl}`;
                    return;
                }

                myPlayerName = userSnap.val().name;
                checkTournament(); // Her şey tamamsa turnuvayı kontrol et

            } catch (error) {
                showError("Bağlantı Hatası", "Kimlik doğrulanırken sunucu ile bağlantı koptu.");
            }
        });

        // 2. TURNUVA BİLGİLERİNİ ÇEK VE DOĞRULA
        async function checkTournament() {
            try {
                const tRef = ref(db, `turnuvalar/${inviteCode}`);
                const tSnap = await fetchWithTimeout(get(tRef));

                if (!tSnap.exists()) {
                    return showError("Turnuva Bulunamadı", "Bu davet kodu geçersiz veya turnuva silinmiş.");
                }

                tournamentData = tSnap.val();
                const meta = tournamentData.meta;
                const players = tournamentData.oyuncular || [];
                const maxCapacity = meta.kapasite || 8; // Eski turnuvalar için varsayılan 8
                
                // Zaten içeride mi?
                const isAlreadyIn = players.some(p => p.uid === currentUserUid);
                if (isAlreadyIn) {
                    window.location.href = `/turnuva.html?id=${inviteCode}`;
                    return;
                }

                // UI'ı Güncelle
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('inviteCard').style.display = 'block';

                document.getElementById('tNameText').innerText = meta.isim;
                document.getElementById('creatorText').innerText = `✍️ Kurucu: ${meta.kurucuIsmi || 'Bilinmiyor'}`;
                document.getElementById('capacityText').innerText = `${players.length} / ${maxCapacity}`;
                
                const fillPercent = (players.length / maxCapacity) * 100;
                document.getElementById('capacityBar').style.width = `${fillPercent}%`;

                const joinBtn = document.getElementById('joinBtn');

                // Kilit Kontrolleri
                if (meta.status && meta.status !== 'bekliyor') {
                    joinBtn.innerText = "🔒 Turnuva Başlamış";
                    joinBtn.disabled = true;
                } else if (players.length >= maxCapacity) {
                    joinBtn.innerText = "🛑 Kapasite Dolu";
                    joinBtn.disabled = true;
                    document.getElementById('capacityBar').style.background = "#ff4444";
                }

            } catch (error) {
                showError("Veri Hatası", "Turnuva bilgileri çekilirken bir sorun oluştu.");
            }
        }

        // 3. TURNUVAYA KATILMA İŞLEMİ
        window.joinTournament = async function() {
            const joinBtn = document.getElementById('joinBtn');
            joinBtn.innerText = "⏳ Katılınıyor...";
            joinBtn.disabled = true;

            try {
                // Kapasiteyi son saniye tekrar kontrol et (Race Condition engeli)
                const tRef = ref(db, `turnuvalar/${inviteCode}`);
                const tSnap = await fetchWithTimeout(get(tRef));
                const currentData = tSnap.val();
                let currentPlayers = currentData.oyuncular || [];
                const maxCap = currentData.meta.kapasite || 8;

                if (currentPlayers.length >= maxCap) {
                    Swal.fire({ icon: 'error', title: 'Geç Kaldın!', text: 'Sen katılana kadar son kontenjan doldu.', background: '#1e1e2e', color: '#fff' });
                    joinBtn.innerText = "🛑 Kapasite Dolu";
                    return;
                }

                // Yeni oyuncuyu listeye ekle
                const newPlayer = {
                    id: currentPlayers.length + 1,
                    uid: currentUserUid,
                    name: myPlayerName,
                    points: 0,
                    gd: 0,
                    played: 0
                };
                
                currentPlayers.push(newPlayer);

                // Firebase'e sadece oyuncu listesini ve güncelleme saatini kaydet
                await update(tRef, {
                    oyuncular: currentPlayers,
                    "meta/lastUpdated": Date.now()
                });

                Toast.fire({ icon: 'success', title: 'Başarıyla katıldın!' });
                
                // 1 saniye sonra turnuvanın içine (bekleme odasına) yolla
                setTimeout(() => {
                    window.location.href = `/turnuva.html?id=${inviteCode}`;
                }, 1000);

            } catch (error) {
                joinBtn.innerText = "Katıl";
                joinBtn.disabled = false;
                Toast.fire({ icon: 'error', title: 'Katılma işlemi başarısız oldu.' });
            }
        };

        // 🔥 GÜNCELLENDİ: Hata sonrası Lobiye 'action=join' mesajı ile dön
        function showError(title, text) {
            document.getElementById('loadingScreen').style.display = 'none';
            Swal.fire({
                title: title, text: text, icon: 'error',
                confirmButtonText: 'Lobiye Dön', confirmButtonColor: '#ff4444',
                background: '#1e1e2e', color: '#fff', allowOutsideClick: false
            }).then(() => {
                // Sadece /index.html yerine gizli parametre ile yolluyoruz
                window.location.href = '/index.html?action=join';
            });
        }
    </script>
</body>
</html>
